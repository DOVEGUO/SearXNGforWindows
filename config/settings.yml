use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - google images
      - bing images
      - google news
      - bing news

general:
  debug: false
  instance_name: "SearXNG for Windows"
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: "bing"
  autocomplete_min: 2
  default_lang: "auto"
  # Recover faster when the public Google CSE endpoint returns HTTP 429.
  suspended_times:
    SearxEngineTooManyRequests: 60
    SearxEngineAccessDenied: 120
  formats:
    - html
    - json

server:
  port: 3001
  bind_address: "127.0.0.1"
  secret_key: "overridden-by-startup-script"
  limiter: false
  public_instance: false
  image_proxy: true
  method: "POST"

valkey:
  url: false

# This is an application-level proxy. It affects only SearXNG's requests to
# search engines and does not change the Windows system proxy.
outgoing:
  proxies: "http://127.0.0.1:7897"
  request_timeout: 30.0
  max_request_timeout: 30.0
  retries: 2
  enable_http2: false
  pool_connections: 20
  pool_maxsize: 10

engines:
  - name: google
    # The legacy Google HTML/GSA engine is inactive upstream because Google now
    # returns an "enable JavaScript" interstitial. google_cse is the replacement
    # implementation, while the public-facing engine name remains "google".
    engine: google_cse
    inactive: false
    disabled: false
    timeout: 30.0

  - name: bing
    disabled: false
    timeout: 30.0
    # Prefer Google CSE in the mixed ranking; Bing via proxy is noisier for
    # Chinese exact-match queries.
    weight: 0.6

  - name: google images
    engine: google_cse
    categories:
      - images
      - web
    google_categ: image
    inactive: false
    disabled: false
    timeout: 30.0

  - name: bing images
    engine: bing_images
    inactive: false
    disabled: false
    timeout: 30.0

  - name: google news
    # Google News frequently returns a CAPTCHA for datacenter/proxy IPs.
    # Use Google's CSE-compatible HTML results in the news category so the
    # Google source remains available instead of suspending the whole engine.
    engine: google_cse
    categories:
      - news
      - web
    inactive: false
    disabled: false
    timeout: 30.0

  - name: bing news
    engine: bing_news
    inactive: false
    disabled: false
    timeout: 30.0
