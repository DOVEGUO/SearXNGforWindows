[botdetection]

ipv4_prefix = 32
ipv6_prefix = 48

# The public site is expected to use a reverse proxy on the same host.
trusted_proxies = [
  "127.0.0.0/8",
  "::1",
]

[botdetection.ip_limit]

filter_link_local = false
link_token = false

[botdetection.ip_lists]

block_ip = []
pass_ip = []
pass_searxng_org = true
